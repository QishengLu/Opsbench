[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsbench-v2"
version = "0.1.0"
description = "Deterministic telemetry evidence enumeration and reference CNF"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["opsbench_v2*"]

[tool.pytest.ini_options]
pythonpath = ["."]
